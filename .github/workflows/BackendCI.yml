name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'backend/**'
      - ".github/workflows/BackendCI.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      test-db:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_remetra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_remetra
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_remetra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run linting
        working-directory: backend
        run: uv run ruff check .

      - name: Run tests with coverage
        working-directory: backend
        run: uv run pytest --cov=services --cov=main --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov/
