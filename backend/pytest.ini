[pytest]

testpaths = tests

pythonpath = .

python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto

addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    live: calls the real Gemini API; skipped unless RUN_LIVE_CHAT_EVAL=1